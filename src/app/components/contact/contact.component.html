<section id="contact">
  <div class="container">
    <div class="contact-grid">

      <!-- LEFT: Info -->
      <div appReveal>
        <div class="section-label">Get In Touch</div>
        <h2 class="section-title">Let's <span class="highlight">work</span> together</h2>
        <p class="section-desc">
          I'm currently open to new opportunities. Whether you have a project,
          a question, or just want to connect — my inbox is always open!
        </p>

        <div class="contact-info">
          <div class="contact-item" *ngFor="let item of contactItems">
            <div class="contact-item-icon">
              <i [class]="item.icon"></i>
            </div>
            <div class="contact-item-text">
              <strong>{{ item.label }}</strong>
              {{ item.value }}
            </div>
          </div>
        </div>

        <div class="social-links">
          <a
            *ngFor="let s of socialLinks"
            [href]="s.url"
            [title]="s.label"
            target="_blank"
            class="social-link"
          >
            <i [class]="s.icon"></i>
          </a>
        </div>
      </div>

      <!-- RIGHT: Form -->
      <div appReveal>
        <div class="contact-form">
          <h3 class="form-title">
            <i class="fas fa-paper-plane"></i>
            Send a Message
          </h3>

          <!-- Success state -->
          <div class="form-success" *ngIf="submitted">
            <i class="fas fa-check-circle"></i>
            <div>
              <strong>Message sent!</strong>
              <span>Thanks for reaching out. I'll get back to you soon.</span>
            </div>
          </div>

          <div *ngIf="!submitted">
            <div class="form-row">
              <div class="form-group">
                <label>Your Name <span>*</span></label>
                <input type="text" [(ngModel)]="form.name" placeholder="John Doe" name="name">
              </div>
              <div class="form-group">
                <label>Your Email <span>*</span></label>
                <input type="email" [(ngModel)]="form.email" placeholder="john@example.com" name="email">
              </div>
            </div>
            <div class="form-group">
              <label>Subject</label>
              <input type="text" [(ngModel)]="form.subject" placeholder="Project Inquiry" name="subject">
            </div>
            <div class="form-group">
              <label>Message <span>*</span></label>
              <textarea [(ngModel)]="form.message" placeholder="Tell me about your project or idea..." name="message" rows="5"></textarea>
            </div>
            <button class="form-submit" (click)="sendMessage()" [class.loading]="submitting">
              <ng-container *ngIf="!submitting">
                <i class="fas fa-paper-plane"></i> Send Message
              </ng-container>
              <ng-container *ngIf="submitting">
                <i class="fas fa-spinner fa-spin"></i> Sending...
              </ng-container>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
