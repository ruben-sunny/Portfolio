<section id="projects">
  <div class="container">
    <div class="projects-header" appReveal>
      <div>
        <div class="section-label">Portfolio</div>
        <h2 class="section-title">My <span class="highlight">Projects</span></h2>
        <p class="section-desc">
          Real-world solutions built with focus on clean code, modularity, and performance.
        </p>
      </div>
      <a href="https://github.com/ruben-sunny?tab=repositories" target="_blank" class="view-all-btn">
        View on GitHub <i class="fas fa-arrow-right"></i>
      </a>
    </div>

    <div class="projects-grid">
      <div
        class="project-card"
        *ngFor="let project of projects; let i = index"
        appReveal
      >
        <!-- Image area -->
        <div class="project-img" [style.background]="project.imgBg">
          <div class="project-img-emoji">{{ project.emoji }}</div>
          <span class="project-img-label">{{ project.label }}</span>
          <!-- Hover overlay -->
          <div class="project-overlay">
            <a [href]="project.demoUrl" class="overlay-btn">
              <i class="fas fa-external-link-alt"></i> Live Demo
            </a>
            <a [href]="project.githubUrl" target="_blank" class="overlay-btn ghost">
              <i class="fab fa-github"></i> Source
            </a>
          </div>
        </div>

        <!-- Body -->
        <div class="project-body">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-desc">{{ project.description }}</p>

          <div class="project-tech">
            <span *ngFor="let t of project.tech">{{ t }}</span>
          </div>

          <div class="project-links">
            <a [href]="project.demoUrl" class="project-link primary-link">
              <i class="fas fa-external-link-alt"></i> Live Demo
            </a>
            <a [href]="project.githubUrl" target="_blank" class="project-link">
              <i class="fab fa-github"></i> GitHub
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
